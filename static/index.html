<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agents">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg">
<title>Agent Chat</title>
<style>
:root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a3; --accent:#10a37f; --danger:#ef5350; --user:#23324a; --warn:#e0a030; --unread:#3b82f6; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f7f7f8; --panel:#ffffff; --line:#e1e3e8; --text:#1d2129; --muted:#6b7280; --user:#dcebff; } }
:root[data-theme="light"] { --bg:#f7f7f8; --panel:#ffffff; --line:#e1e3e8; --text:#1d2129; --muted:#6b7280; --user:#dcebff; }
.ui-icon { display:inline-flex; width:18px; height:18px; align-items:center; justify-content:center; }
.ui-icon svg { width:100%; height:100%; stroke:currentColor; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* The page itself never scrolls: only the lists inside do. WebKit takes the viewport's overscroll rule from
   html, not body, and without it a drag that starts at the end of the log moves the whole page on iOS. */
html, body { height:100%; margin:0; overflow:hidden; }
html { overscroll-behavior:none; }
body { background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; overscroll-behavior:none; }
button, input, textarea, select { font:inherit; color:inherit; }
button { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 12px; min-height:40px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger { color:var(--danger); }
button:disabled { opacity:.5; }
input, textarea, select { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; }
.view { display:none; height:100dvh; flex-direction:column; padding-top:env(safe-area-inset-top); }
.view.on { display:flex; }
header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:17px; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header small { display:block; font-size:12px; color:var(--muted); font-weight:400; }
.pad { padding:16px; }
.muted { color:var(--muted); font-size:13px; }
#login form { margin:auto; width:min(340px, 88vw); display:grid; gap:12px; }
#list { flex:1; overflow:auto; overscroll-behavior:contain; padding:12px; display:grid; gap:10px; align-content:start; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; }
.card .main { flex:1; min-width:0; }
.card .preview { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; font-size:13px; line-height:1.4; margin-top:4px; word-break:break-word; }
.card .preview time { color:var(--muted); margin-right:6px; font-variant-numeric:tabular-nums; }
.card b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tag { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
.dot.busy { background:var(--warn); animation:pulse 1s infinite; } .dot.idle { background:var(--accent); } .dot.exited { background:var(--danger); }
.dot.unread { background:var(--unread); }
@keyframes pulse { 50% { opacity:.35; } }
.bar { display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); overflow-x:auto; }
.bar button { flex:1; white-space:nowrap; padding:6px 8px; min-height:36px; font-size:14px; }
#log { flex:1; overflow:auto; overscroll-behavior:contain; padding:12px; -webkit-overflow-scrolling:touch; }
.block { margin:0 0 10px; position:relative; }
/* Panes are 100 columns (server.py PANE_WIDTH): a phone wraps each long line instead of scrolling sideways. */
.block pre { margin:0; white-space:pre-wrap; word-break:break-word; font:var(--log-size, 12.5px)/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
.block.user { margin-left:18%; background:var(--user); border-radius:14px 14px 4px 14px; padding:8px 12px; }
.block.agent { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px 30px; }
.block .copy { position:absolute; right:6px; bottom:4px; min-height:24px; padding:1px 8px; font-size:12px; border:0; background:transparent; color:var(--muted); }
#keys { display:none; gap:6px; padding:6px 12px; overflow-x:auto; border-top:1px solid var(--line); }
#keys.on { display:flex; }
#keys button { min-width:48px; padding:4px 8px; min-height:36px; }
#compose { display:flex; gap:8px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--panel); align-items:flex-end; }
#compose button { white-space:nowrap; flex:none; }
#compose textarea { resize:none; max-height:40vh; min-height:44px; }
#status { font-size:12px; color:var(--muted); padding:2px 12px; min-height:20px; }
#status.error { color:var(--danger); }
dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:16px; width:min(420px, 92vw); padding:16px; max-height:80dvh; }
dialog::backdrop { background:rgba(0,0,0,.5); }
dialog h3 { margin:0 0 10px; }
.options { display:grid; gap:8px; max-height:52dvh; overflow:auto; margin:10px 0; }
.options button { text-align:left; }
.options button.current { border-color:var(--accent); }
.row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
/* Desktop: the session list stays as a sidebar beside the chat; buttons keep their natural width. */
body.wide #home.on, body.wide #home.side { display:flex; position:fixed; inset:0 auto 0 0; width:300px; border-right:1px solid var(--line); }
body.wide #chat { margin-left:300px; }
body.wide #home header { flex-wrap:wrap; }
body.wide #home header h1 { flex-basis:100%; }
body.wide #home header button { min-height:32px; padding:4px 10px; font-size:14px; }
body.wide #back { display:none; }
body.wide .card { cursor:pointer; padding:10px 12px; }
body.wide .card:hover { border-color:var(--muted); }
body.wide .card.current { border-color:var(--accent); }
body.wide header button, body.wide .bar button, body.wide #keys button { min-height:32px; padding:4px 12px; font-size:14px; }
body.wide .bar { justify-content:flex-start; }
body.wide .bar button { flex:none; }
body.wide .bar #kill { margin-left:auto; }
body.wide #empty.on { display:flex; margin-left:300px; height:100dvh; align-items:center; justify-content:center; }
#empty { display:none; }
</style>
</head>
<body>
<section id="login" class="view">
  <form id="login-form">
    <h2 style="margin:0">Agent Chat</h2>
    <p id="login-note" class="muted" style="margin:0"></p>
    <input id="password" type="password" autocomplete="current-password" placeholder="密码" required>
    <input id="password2" type="password" autocomplete="new-password" placeholder="再输入一次" hidden>
    <label class="muted"><input id="remember" type="checkbox" checked style="width:auto"> 保持登录 30 天</label>
    <button id="login-submit" class="primary" type="submit">登录</button>
    <p id="login-error" class="muted" style="color:var(--danger);margin:0"></p>
  </form>
</section>

<section id="home" class="view">
  <header><h1>Agent 会话</h1><button id="theme-toggle" type="button"></button><button id="create-open" class="primary">新建</button><button id="logout">退出</button></header>
  <div id="list"></div>
  <p id="home-status" class="muted pad" style="margin:0"></p>
</section>

<p id="empty" class="muted">从左侧选择一个会话，或点「新建」。</p>

<section id="chat" class="view">
  <header><button id="back" aria-label="返回">‹</button><span id="chat-dot" class="dot"></span><h1><span id="chat-name"></span><small id="chat-sub"></small></h1><button id="font-down" aria-label="字体变小">−</button><button id="font-up" aria-label="字体变大">+</button><button id="rename">改名</button></header>
  <div class="bar"><button id="model">Model</button><button id="effort">Effort</button><button id="new">New</button><button id="usage" type="button" hidden>额度</button><button id="keys-toggle">按键</button><button id="kill" class="danger">关闭 tmux</button></div>
  <div id="log"></div>
  <div id="status"></div>
  <div id="keys"><button data-key="Up">↑</button><button data-key="Down">↓</button><button data-key="Left">←</button><button data-key="Right">→</button><button data-key="Enter">Enter</button><button data-key="Escape">Esc</button><button data-key="Tab">Tab</button><button data-key="s">s</button><button data-key="y">y</button><button data-key="n">n</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="C-c">Ctrl-C</button></div>
  <form id="compose"><textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="enter"></textarea><button class="primary" type="submit" id="send">发送</button></form>
</section>

<dialog id="sheet"><h3 id="sheet-title"></h3><p id="sheet-note" class="muted" style="margin:0"></p><div id="sheet-body"></div><div class="row" id="sheet-actions"></div></dialog>
<script src="/app.js"></script>
</body>
</html>
